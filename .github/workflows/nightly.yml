name: Nightly

# Microsoft publishes WSL2 kernels as tags on its own kernel tree, a few times a
# year per branch. This polls for tags we have not built yet and publishes an
# image per (tag, arch); on most nights it finds nothing and exits.

on:
  schedule:
    - cron: "40 2 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Build one specific tag instead of polling"
        type: string
      force:
        description: "Rebuild even if the image already exists"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Microsoft's live branches. Add the next one here when it appears.
  BRANCHES: "6.6 6.18"
  # How many of each branch's newest tags to keep built. Anyone who has not run
  # `wsl --update` recently is a tag or two behind, and their driver has to match
  # the kernel they are actually running.
  TAGS_PER_BRANCH: "2"

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      builds: ${{ steps.plan.outputs.builds }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      # The newest TAGS_PER_BRANCH tags of each branch, minus what is already
      # published. `docker manifest inspect` failing is the "not published yet"
      # signal. Tags that fall out of the window stay published; nothing prunes
      # them, so users on older kernels keep working.
      - name: Plan builds
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          ONE_TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ -n "$ONE_TAG" ]; then
            tags="$ONE_TAG"
          else
            tags=""
            for b in $BRANCHES; do
              newest=$(gh api --paginate \
                repos/microsoft/WSL2-Linux-Kernel/git/matching-refs/tags/linux-msft-wsl-$b. \
                --jq '.[].ref' | sed 's|refs/tags/||' | sort -u -V | tail -n"$TAGS_PER_BRANCH")
              [ -n "$newest" ] && tags="$tags $newest"
            done
          fi
          echo "candidate tags:$tags"

          builds='[]'
          for t in $tags; do
            # Images are tagged by kernel version, not by Microsoft's git tag:
            # the package name already says which kernel this is, and the version
            # is the first field of `uname -r` inside WSL2.
            v="${t#linux-msft-wsl-}"
            for a in x86; do   # arm64: see the note in README
              if [ "$FORCE" != "true" ] && docker manifest inspect "$IMAGE:$v-$a" >/dev/null 2>&1; then
                echo "$v-$a already published"
                continue
              fi
              builds=$(echo "$builds" | jq -c --arg t "$t" --arg v "$v" --arg a "$a" \
                '. + [{tag: $t, version: $v, arch: $a, runner: "ubuntu-24.04"}]')
            done
          done
          echo "builds=$builds" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$builds" | jq 'length')" >> "$GITHUB_OUTPUT"
          echo "$builds" | jq .

  build:
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.builds) }}
    steps:
      - uses: actions/checkout@v5
      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - uses: docker/setup-buildx-action@v3
      # The kernel build is ~25 min and keyed on an immutable tag, so a change
      # to the image layers alone should not pay for it again. The cache lives in
      # its own package: buildx registry cache is stored as a tag, and it has no
      # business cluttering the tag list people pull from. Prunable at any time;
      # a miss just means a full rebuild.
      #
      # The image self-tests as it builds (see the Dockerfile), so a broken tree
      # or a missing runtime library fails before anything is pushed.
      - name: Build and push ${{ matrix.version }} (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ matrix.version }}-${{ matrix.arch }}
          build-args: |
            TAG=${{ matrix.tag }}
            ARCH=${{ matrix.arch }}
          cache-from: type=registry,ref=${{ env.IMAGE }}-cache:${{ matrix.version }}-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}-cache:${{ matrix.version }}-${{ matrix.arch }},mode=max
      - name: Check the pushed image
        run: |
          docker run --rm "$IMAGE:${{ matrix.version }}-${{ matrix.arch }}" \
            sh -c 'K=$(cat /kversion); echo "$K"; test -f /lib/modules/$K/build/Module.symvers'
